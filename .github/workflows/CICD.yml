name: Futureestic Dashboard CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Default permission
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ==================================================
  # CI - Lint and Build
  # ==================================================
  ci:
    name: CI - Lint & Build
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # 3. Install exact dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run Oxlint
      - name: Run Oxlint
        run: npm run lint

      # 5. Build application
      # npm run build already runs:
      # tsc -b && vite build
      - name: Build application
        run: npm run build

      # 6. Verify production build
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Build output verified successfully."

      # 7. Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 8. Upload production build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist


  # ==================================================
  # CD - Deploy to GitHub Pages
  # ==================================================
  deploy:
    name: CD - Deploy to GitHub Pages

    # IMPORTANT:
    # Deployment starts ONLY after CI succeeds
    needs: ci

    # Deploy only push to main.
    # Pull requests will run CI but will NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # Deploy the artifact created by CI
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
